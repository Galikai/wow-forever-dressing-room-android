name: Build Forever Dressing Room APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Create Android project
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/gali/foreverdressingroom

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "ForeverDressingRoom"
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=false
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.gali.foreverdressingroom'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.gali.foreverdressingroom'
                  minSdk 24
                  targetSdk 35
                  versionCode 1
                  versionName '1.0.0'
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:allowBackup="true"
                  android:hardwareAccelerated="true"
                  android:label="Forever Dressing Room"
                  android:theme="@android:style/Theme.Material.NoActionBar"
                  android:usesCleartextTraffic="false">

                  <activity
                      android:name=".MainActivity"
                      android:configChanges="keyboardHidden|orientation|screenSize"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/gali/foreverdressingroom/MainActivity.java <<'EOF'
          package com.gali.foreverdressingroom;

          import android.app.Activity;
          import android.app.AlertDialog;
          import android.content.ClipData;
          import android.content.ClipboardManager;
          import android.content.Context;
          import android.content.Intent;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Bundle;
          import android.view.Gravity;
          import android.webkit.CookieManager;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.LinearLayout;
          import android.widget.Toast;

          public class MainActivity extends Activity {
              private static final String HOME = "https://www.wowhead.com/forever/dressing-room";
              private WebView webView;
              private boolean desktopMode = false;
              private String mobileUa;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setBackgroundColor(Color.BLACK);

                  LinearLayout bar = new LinearLayout(this);
                  bar.setOrientation(LinearLayout.HORIZONTAL);
                  bar.setGravity(Gravity.CENTER_VERTICAL);
                  bar.setPadding(dp(4), dp(3), dp(4), dp(3));
                  bar.setBackgroundColor(Color.rgb(24,24,24));

                  Button home = makeButton("⌂");
                  Button reload = makeButton("↻");
                  Button link = makeButton("URL");
                  Button copy = makeButton("Copiar");
                  Button desktop = makeButton("PC");

                  bar.addView(home);
                  bar.addView(reload);
                  bar.addView(link, new LinearLayout.LayoutParams(0, dp(42), 1));
                  bar.addView(copy, new LinearLayout.LayoutParams(0, dp(42), 1));
                  bar.addView(desktop);

                  webView = new WebView(this);
                  WebSettings s = webView.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setLoadsImagesAutomatically(true);
                  s.setAllowContentAccess(true);
                  s.setAllowFileAccess(false);
                  s.setSupportZoom(true);
                  s.setBuiltInZoomControls(true);
                  s.setDisplayZoomControls(false);
                  s.setUseWideViewPort(true);
                  s.setLoadWithOverviewMode(true);
                  s.setJavaScriptCanOpenWindowsAutomatically(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  s.setMixedContentMode(WebSettings.MIXED_CONTENT_COMPATIBILITY_MODE);
                  mobileUa = s.getUserAgentString();

                  CookieManager cookies = CookieManager.getInstance();
                  cookies.setAcceptCookie(true);
                  cookies.setAcceptThirdPartyCookies(webView, true);

                  webView.setWebChromeClient(new WebChromeClient());
                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, String url) {
                          Uri u = Uri.parse(url);
                          String scheme = u.getScheme();
                          if (scheme == null || scheme.equals("http") || scheme.equals("https")) return false;
                          try {
                              startActivity(new Intent(Intent.ACTION_VIEW, u));
                          } catch (Exception ignored) { }
                          return true;
                      }
                  });

                  root.addView(bar, new LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT, dp(48)));
                  root.addView(webView, new LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT, 0, 1));
                  setContentView(root);

                  home.setOnClickListener(v -> webView.loadUrl(HOME));
                  reload.setOnClickListener(v -> webView.reload());
                  link.setOnClickListener(v -> showUrlDialog());
                  copy.setOnClickListener(v -> copyCurrentUrl());
                  desktop.setOnClickListener(v -> {
                      desktopMode = !desktopMode;
                      WebSettings ws = webView.getSettings();
                      if (desktopMode) {
                          String ua = mobileUa
                                  .replace("; wv", "")
                                  .replace(" Mobile ", " ")
                                  .replace(" Mobile", "");
                          ws.setUserAgentString(ua);
                          desktop.setText("Móvil");
                      } else {
                          ws.setUserAgentString(mobileUa);
                          desktop.setText("PC");
                      }
                      webView.reload();
                  });

                  if (savedInstanceState == null) {
                      webView.loadUrl(HOME);
                  } else {
                      webView.restoreState(savedInstanceState);
                  }
              }

              private Button makeButton(String text) {
                  Button b = new Button(this);
                  b.setText(text);
                  b.setTextColor(Color.WHITE);
                  b.setAllCaps(false);
                  b.setTextSize(13);
                  b.setMinWidth(dp(52));
                  b.setMinimumWidth(dp(52));
                  b.setPadding(dp(8), 0, dp(8), 0);
                  b.setBackgroundColor(Color.rgb(45,45,45));
                  LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(dp(58), dp(42));
                  lp.setMargins(dp(2), 0, dp(2), 0);
                  b.setLayoutParams(lp);
                  return b;
              }

              private void showUrlDialog() {
                  final EditText input = new EditText(this);
                  input.setSingleLine(false);
                  input.setHint("Pegá una URL de Wowhead Dressing Room");
                  input.setText(webView.getUrl());
                  input.setSelectAllOnFocus(true);

                  new AlertDialog.Builder(this)
                          .setTitle("Abrir Dressing Room")
                          .setView(input)
                          .setPositiveButton("Abrir", (d, which) -> {
                              String url = input.getText().toString().trim();
                              if (!url.startsWith("http://") && !url.startsWith("https://")) {
                                  url = "https://" + url;
                              }
                              webView.loadUrl(url);
                          })
                          .setNeutralButton("Forever", (d, which) -> webView.loadUrl(HOME))
                          .setNegativeButton("Cancelar", null)
                          .show();
              }

              private void copyCurrentUrl() {
                  String url = webView.getUrl();
                  if (url == null) return;
                  ClipboardManager cm = (ClipboardManager) getSystemService(Context.CLIPBOARD_SERVICE);
                  cm.setPrimaryClip(ClipData.newPlainText("Dressing Room", url));
                  Toast.makeText(this, "Link copiado", Toast.LENGTH_SHORT).show();
              }

              @Override
              protected void onSaveInstanceState(Bundle outState) {
                  webView.saveState(outState);
                  super.onSaveInstanceState(outState);
              }

              @Override
              public void onBackPressed() {
                  if (webView.canGoBack()) webView.goBack();
                  else super.onBackPressed();
              }

              @Override
              protected void onDestroy() {
                  if (webView != null) webView.destroy();
                  super.onDestroy();
              }

              private int dp(int value) {
                  float density = getResources().getDisplayMetrics().density;
                  return Math.round(value * density);
              }
          }
          EOF

      - name: Build debug APK
        run: gradle :app:assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Forever-Dressing-Room-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
